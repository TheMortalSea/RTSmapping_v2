# Family E: DINOv3 **satellite** ViT-7B (SAT-493M), **frozen linear-probe** — a cheap
# upper-bound on satellite feature quality. The 6.7B encoder is too large to fine-tune on
# A100-80GB, so it's frozen the entire run (freeze_backbone_epochs ≥ max_epochs) and only the
# FPN decoder + head train (linear-probe). Reads the same SAT-493M native normalization.
#
# Frozen-whole-run notes: EMA is constructed at unfreeze (never happens here), so the best
# deployment checkpoint is saved from LIVE decoder weights (train.py handles ema=None). Batch
# reduced to 4 (6.7B frozen forward at 512²); LLRD disabled (encoder frozen → uniform groups).
base: base_v2_fast.yaml
data:
  data_root: /outputs/v1.0/data_local
  normalization_stats_path: /outputs/v1.0/staging/v1_splits/normalization_stats_dinov3sat.json
channels:
  rgb: true
  extra: []
model:
  architecture: foundation
  backbone: vit_7b_patch16_dinov3.sat493m
  pretrained: true
training:
  batch_size: 4
optimizer:
  weight_decay: 5.0e-2
lr_schedule:
  frozen_lr: 1.0e-3              # decoder/head LR (encoder stays frozen all run)
  base_lr: 2.0e-4
  backbone_lr_multiplier: 1.0
  llrd_decay: null              # encoder frozen → uniform param groups (no .blocks LLRD)
  freeze_backbone_epochs: 999   # ≥ max_epochs (120) → never unfreeze (linear-probe)
  warmup_epochs: 5
  warmup_start_lr: 1.0e-6
  min_lr: 1.0e-6
  backbone_warmup_epochs: 5
mlflow:
  run_name: fm_dinov3sat_7b_frozen
