# Family E control: web DINOv3 (LVD-1689M) ViT-B, RGB-only, with its NATIVE ImageNet norm.
# De-confounds the satellite-DINOv3 comparison: the existing web run (phase4_fm_dinov3_rgb,
# 0.873) used per-dataset z-score, while fm_dinov3sat_l_rgb uses sat-native norm — so a sat
# win could be the satellite weights OR just better normalization. This run = web weights +
# native ImageNet norm, making web-vs-sat a clean each-with-its-native-norm comparison.
# Identical to phase4_fm_dinov3_rgb except normalization_stats_path.
base: phase0c_seed42.yaml
data:
  data_root: /outputs/v1.0/data_local
  normalization_stats_path: /outputs/v1.0/staging/v1_splits/normalization_stats_imagenet.json
channels:
  rgb: true
  extra: []
model:
  architecture: foundation
  backbone: vit_base_patch16_dinov3
  pretrained: true
optimizer:
  weight_decay: 5.0e-2
lr_schedule:
  frozen_lr: 1.0e-3
  base_lr: 2.0e-4
  backbone_lr_multiplier: 1.0
  llrd_decay: 0.75
  freeze_backbone_epochs: 20
  warmup_epochs: 5
  warmup_start_lr: 1.0e-6
  min_lr: 1.0e-6
  backbone_warmup_epochs: 5
mlflow:
  run_name: fm_dinov3_rgb_imagenet
