# Step 3a fusion sweep (second-wave plan): F2 input channel-attention on the cross-modal pair
# ndvi + se_proto (cleanest optical-decorrelated complement to NDVI per the Step-1 correlation
# map). model.fusion=chan_attn; 2-channel subset norm stats.
base: phase0c_seed42.yaml
data:
  data_root: /outputs/v1.0/data_local
  normalization_stats_path: /outputs/v1.0/staging/v1_splits/normalization_stats_ndvi_seproto.json
model:
  fusion: chan_attn
channels:
  rgb: true
  extra:
    - {name: ndvi,     band: 0}
    - {name: se_proto, band: 5}
mlflow:
  run_name: phase4_f2_ndvi_seproto
