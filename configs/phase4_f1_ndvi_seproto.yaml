# Step 3a fusion sweep (second-wave plan): F1 smart-stem-init on the cross-modal pair
# ndvi + se_proto (SE_PROTO is the cleanest optical-decorrelated complement to NDVI per the
# Step-1 8-band correlation map). model.fusion=stem_init; 2-channel subset norm stats.
base: phase0c_seed42.yaml
data:
  data_root: /outputs/v1.0/data_local
  normalization_stats_path: /outputs/v1.0/staging/v1_splits/normalization_stats_ndvi_seproto.json
model:
  fusion: stem_init
channels:
  rgb: true
  extra:
    - {name: ndvi,     band: 0}
    - {name: se_proto, band: 5}
mlflow:
  run_name: phase4_f1_ndvi_seproto
